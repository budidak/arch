# These settings are applied when the NVIDIA driver is loaded.
# /etc/modprobe.d/nvidia.conf

# Prevent loading of the Nouveau driver 
# (ensuring that the proprietary NVIDIA driver is used instead.)
blacklist nouveau

# Set default mode
# This option specifies that the NVIDIA driver should use the default mode for the display.
# This can help ensure that the display operates in a standard configuration,
# which can be useful for compatibility.
options nvidia "NVreg_UseDefaultMode=1"

# Enable modesetting for smoother transitions and better performance
options nvidia "NVreg_Modeset=1"

# Enable framebuffer support
# When framebuffer support is enabled, the driver can manage the framebuffer for rendering graphics.
options nvidia "NVreg_Framebuffer=1"

# Enable framebuffer device support for compatibility with certain environments
options nvidia "NVreg_UseFBDev=1"

# Enable optimized page flip for better performance in graphics applications
options nvidia "NVreg_UseOptimizedPageFlip=1"

# Preserve video memory allocations to reduce overhead in context switching
options nvidia "NVreg_PreserveVideoMemoryAllocations=1"

# Enable brightness control for laptops
options nvidia "NVreg_RegistryDwords=EnableBrightnessControl=1"

# Enabling PAT can improve memory management efficiency,
# allowing the GPU to access memory more effectively.
options nvidia "NVreg_UsePageAttributeTable=1"

# Enable PRIME Synchronization
# It allows for proper synchronization between the two GPUs,
# ensuring that rendering tasks are efficiently offloaded to the NVIDIA GPU
# while the display is managed by the integrated AMD GPU.
options nvidia "NVreg_UsePRIME=1"

# Enable GPU Hotplugging
# Useful if you frequently connect/disconnect displays for a smoother experience.
options nvidia "NVreg_Hotplug=1"

# Disable GPU Overclocking
options nvidia "NVreg_RegistryDwords=Overclocking=0"

# Set the performance level of the NVIDIA GPU.
# 0:Adaptive, 1:Maximum Performance, 2:Maximum Power Saving
options nvidia "NVreg_PerformanceLevel=0"

# Enable Vulkan Support
# This option enables support for the Vulkan graphics API,
# which is a modern graphics and compute API that provides high-efficiency access to graphics hardware.
# Enabling this allows applications that use Vulkan to run on the NVIDIA GPU.
options nvidia "NVreg_Vulkan=1"

# Enable OpenGL support
# This option enables support for the OpenGL graphics API,
# which is widely used for rendering 2D and 3D vector graphics.
# This is essential for applications that rely on OpenGL for rendering.
options nvidia "NVreg_OpenGL=1"

# Specify which display device to use
options nvidia "NVreg_UseDisplayDevice=0"  # 0 = Auto, 1 = HDMI, 2 = DVI, etc.

# Enable Kernel Mode Setting (KMS)
# This option enables Kernel Mode Setting, which allows the Linux kernel 
# to set the display resolution and depth before the X server starts.
# This can lead to smoother transitions and better performance during boot
# and when switching between virtual terminals.
options nvidia "NVreg_EnableKms=1"

# Specify which GPU to use in multi-GPU setups
# options nvidia "NVreg_UseGpu=0"  # 0 = First GPU, 1 = Second GPU, etc.

# Set resource management debug level
# 0 = No debug output, higher values for more verbosity
options nvidia "NVreg_ResmanDebugLevel=0"

# Enable debugging for troubleshooting
options nvidia "NVreg_UseDebug=1"

# Set log level (0=none, 1=errors, 2=warnings, 3=info)
options nvidia "NVreg_LogLevel=3"

# Enable error reporting
options nvidia "NVreg_ErrorReporting=1"

# Enable PowerMizer at its maximum performance level (VSync will not work without this):
options nvidia NVreg_RegistryDwords="PerfLevelSrc=0x2222"
