[General]
### systemd-networkd will manage network, not iwd. ###
EnableNetworkConfiguration=false

### 
AddressRandomization=network
AddressRandomizationRange=full
RoamThreshold=-72
RoamThreshold5G=-68
# CriticalRoamThreshold=-80
# CriticalRoamThreshold5G=-82
# RoamRetryInterval=60
ManagementFrameProtection=1
ControlPortOverNL80211=true
DisableANQP=true
DisableOCV=false
# SystemdEncrypt=my-iwd-key
Country=TR
DisablePMKSA=false

[Network]
### systemd-networkd manages these settings. ###
# EnableIPv6=true
# NameResolvingService=systemd
# RoutePriorityOffset=300

[Blacklist]
# InitialTimeout=60
# InitialAccessPointBusyTimeout=30
# Multiplier=30
# MaximumTimeout=14400

[Rank]
BandModifier2_4GHz=1.0
BandModifier5GHz=1.0
BandModifier6GHz=1.0
HighUtilizationThreshold=0
HighStationCountThreshold=0

[Scan]
DisablePeriodicScan=false
InitialPeriodicScanInterval=10
MaximumPeriodicScanInterval=300
DisableRoamingScan=false

[IPv4]
APAddressPool=192.168.0.0/16

