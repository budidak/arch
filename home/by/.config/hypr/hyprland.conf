# -----------------------------------------------
# GENERAL
# -----------------------------------------------

general {
   border_size = 2
   gaps_in = 4
   gaps_out = 8
   gaps_workspaces = 0
   col.inactive_border = rgba(22222222)
   col.active_border = rgba(be8dafdc) rgba(278b9ece) 90deg
   col.nogroup_border = rgba(22222222)
   col.nogroup_border_active = rgba(be8dafdc) rgba(278b9ece) 90deg
   allow_tearing = true
   resize_corner = 1
}

decoration {
   rounding = 10
   rounding_power = 4.0
   inactive_opacity = 0.999
   dim_inactive = true
   dim_strength = 0.25
   blur {
      enabled = false
      new_optimizations = true
      xray = true
   }
   shadow {
      enabled = false
   }
}

group {
   auto_group = true
   insert_after_current = true

   groupbar {
      enabled = true
      font_family = monospace
      font_size = 10
      render_titles = true
      height = 24
      indicator_height = 6
      stacked = false
      col.active = 0xAAFF5500
      col.inactive = 0xAA777700
   }
}

animations {
   enabled = false
   animation = windows, 1, 8, default, popin 64%
   animation = workspaces, 1, 8, default, slidefade 64%
}

input {
   kb_layout = tr
   numlock_by_default = true
   repeat_rate = 64
   repeat_delay = 256
   accel_profile = adaptive
   follow_mouse = 1
   natural_scroll = false
   sensitivity = 0.5
   touchpad {
      disable_while_typing = true
      natural_scroll = true
   }
}

misc {
   disable_hyprland_logo=true
   disable_splash_rendering=false
   force_default_wallpaper=0
   # vfr = true
   # vrr = 1
   mouse_move_enables_dpms = true
   key_press_enables_dpms = true
   focus_on_activate = true
   middle_click_paste = true
}

binds {
   movefocus_cycles_fullscreen = true
}

xwayland {
   enabled = true
   force_zero_scaling = true
}

opengl {
   nvidia_anti_flicker = true
}

ecosystem {
   no_update_news = true
   no_donation_nag = true
}

dwindle {
   pseudotile = true
   preserve_split = true
}
