# -----------------------------------------------
# MONITORS
# -----------------------------------------------

monitor = , preferred, auto, 1


# -----------------------------------------------
# ENVIRONMENT VARIABLES
# -----------------------------------------------

env = HYPRLAND_TRACE,0
env = HYPRLAND_NO_RT,1
env = HYPRLAND_NO_SD_NOTIFY,1
env = HYPRLAND_NO_SD_VARS,1

env = AQ_TRACE,0
env = AQ_MGPU_NO_EXPLICIT,0
env = AQ_NO_MODIFIERS,0
env = AQ_FORCE_LINEAR_BLIT,0

# env = GBM_BACKEND,nvidia-drm
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = LIBVA_DRIVER_NAME,nvidia
# env = __GL_GSYNC_ALLOWED,1
# env = __GL_VRR_ALLOWED,1
# env = NVD_BACKEND,direct

# env = WLR_BACKENDS,wayland,x11,drm
# env = WLR_NO_HARDWARE_CURSORS,1
# env = WLR_RENDERER,vulkan

env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland,x11
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# env = GDK_SCALE,1
# env = GTK_THEME,Adwaita:dark
# env = XCURSOR_THEME,Adwaita:dark
# env = XCURSOR_SIZE,24

env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE=qt5ct
env = QT_SCALE_FACTOR_ROUNDING_POLICY,RoundPreferFloor

env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = MOZ_ENABLE_WAYLAND,1
env = _JAVA_AWT_WM_NONREPARENTING,1


# -----------------------------------------------
# AUTOSTART
# -----------------------------------------------

exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user enable --now hyprpolkitagent
exec-once = systemctl --user enable --now hypridle
exec-once = systemctl --user enable --now hyprpaper
exec-once = systemctl --user enable --now pipewire
exec-once = systemctl --user enable --now pipewire-pulse
exec-once = systemctl --user enable --now wireplumber
exec-once = systemctl --user enable --now fnott
exec-once = systemctl --user enable --now waybar
exec-once = systemctl --user enable --now xdg-desktop-portal-hyprland
exec-once = systemctl --user enable --now xdg-desktop-portal-gtk
exec-once = systemctl --user enable --now xdg-desktop-portal
exec-once = systemctl --user import-environment QT_QPA_PLATFORMTHEME
exec-once = ~/.config/fzf/theme.sh
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark'
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# exec-once = hyprpm reload -n

# -----------------------------------------------
# KEYBINDS
# -----------------------------------------------

$terminal = foot
$launcher = fuzzel
$fileManager = yazi
$taskManager = btm
$browser = firefox

$mainMod = SUPER
$altMod = ALT_L
$ctrlMod = Control_L

bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, pgrep $launcher && pkill $launcher || $launcher
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, SPACE, exec, $terminal $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, N, exec, $browser --private-window https://startpage.com
bind = $mainMod, H, exec, cliphist list | $launcher --dmenu | cliphist decode | wl-copy
bind = , Print, exec, (hyprpicker -rzq & sleep 0.1; grim -g "$(slurp -d)" - | swappy -f -)
bind = $mainMod, S, exec, [float; size 1000 1000; center] $terminal rgfzf
bind = $mainMod, P, exec, [float] start-emulator
# bind = SUPER, a, hyprexpo:expo, toggle
# bind = , XF86Calculator, exec, $calculator

bind = $mainMod, TAB, cyclenext, next
bind = $mainMod, TAB, alterzorder, top
bind = $mainMod_SHIFT, TAB, cyclenext, prev
bind = $mainMod_SHIFT, TAB, alterzorder, top

bind = $mainMod, G, togglegroup
bind = $mainMod_SHIFT, O, moveoutofgroup
bind = $mainMod_SHIFT, P, moveintogroup, r
# bind = $mainMod_SHIFT, P, moveintogroup, l
# bind = $altMod, TAB, changegroupactive, n
# bind = $altMod_SHIFT, TAB, changegroupactive, b

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0 , togglespecialworkspace, magic
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bind = $mainMod_SHIFT, 1, movetoworkspace, 1
bind = $mainMod_SHIFT, 2, movetoworkspace, 2
bind = $mainMod_SHIFT, 3, movetoworkspace, 3
bind = $mainMod_SHIFT, 4, movetoworkspace, 4
bind = $mainMod_SHIFT, 5, movetoworkspace, 5
bind = $mainMod_SHIFT, 6, movetoworkspace, 6
bind = $mainMod_SHIFT, 7, movetoworkspace, 7
bind = $mainMod_SHIFT, 8, movetoworkspace, 8
bind = $mainMod_SHIFT, 9, movetoworkspace, 9
bind = $mainMod_SHIFT, 0, movetoworkspace, special:magic
bindm = $mainMod, mouse:272, movewindow

bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, F, togglefloating,
bind = $altMod, P, pseudo,
bind = $altMod, T, togglesplit,
bind = $altMod, R, submap, resize
submap = resize
binde = , left, resizeactive, -10 0
binde = , right, resizeactive, 10 0
binde = , up, resizeactive, 0 -10
binde = , down, resizeactive, 0 10
binde = , H, resizeactive, -10 0
binde = , L, resizeactive, 10 0
binde = , K, resizeactive, 0 -10
binde = , J, resizeactive, 0 10
bind = , escape, submap, reset
submap = reset

binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_SOURCE_SINK@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

bind = , XF86MonBrightnessUp, exec, brightnessctl -n5 s 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl -n5 s 5%-
bind = , XF86KbdBrightnessUp, exec, brightnessctl -d *::kbd_backlight s 33%-
bind = , XF86KbdBrightnessDown, exec, brightnessctl -d *::kbd_backlight s 33%-

bind = $ctrlMod_SHIFT, Q, exec, \
  notify-send --urgency=critical --expire-time=1500 --app-name="SYSTEM" "SHUT DOWN"; \
  sleep 3; \
  poweroff
bind = $ctrlMod_SHIFT, R, exec, \
  notify-send --urgency=critical --expire-time=1500 --app-name="SYSTEM" "REBOOT"; \
  sleep 3; \
  reboot
bind = $ctrlMod_SHIFT, S, exec, \
  notify-send --urgency=critical --expire-time=1500 --app-name="SYSTEM" "SLEEP"; \
  sleep 3; \
  loginctl lock-session && sleep 3 && hyprctl dispatch dpms off && sleep 3 && systemctl suspend
bind = $ctrlMod_SHIFT, L, exec, hyprlock
bind = $ctrlMod_SHIFT, E, exit,
bind = $ctrlMod_SHIFT, ESCAPE, exec, [float; size 1000 1000; center] $terminal $taskManager
# bind = , Caps_Lock, exec, ~/.config/hypr/scripts/key_state.sh --caps
# bind = , Num_Lock, exec, ~/.config/hypr/scripts/key_state.sh --num
# bind = , Scroll_Lock, exec, ~/.config/hypr/scripts/key_state.sh --scroll


# -----------------------------------------------
# RULES
# -----------------------------------------------

# windowrule = decorate false, match:focus 0
# windowrule = decorate false, match:focus 1
windowrule = opacity 0.995, match:focus 0 floating:1
windowrule = float on, match:class imv
windowrule = float on, match:title Emulator|Calculator
# windowrule = float on, size (monitor_w*0.5) (monitor_h*0.5), match:class .*zenity.*|.*blueman.*
# windowrule = size (monitor_w*0.2) (monitor_h*0.5), match:title Calculator


