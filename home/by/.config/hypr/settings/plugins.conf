#
# PLUGIN CONFIGURATIONS
# ~/.config/hypr/settings/plugins.conf
#

plugin {
  hyprexpo {
    columns = 3
    gap_size = 5
    bg_col = rgb(212547)
    workspace_method = center current
    enable_gesture = true
    gesture_fingers = 3
    gesture_distance = 300 # how far is the "max"
    gesture_positive = true # Positive = swipe down. Negative = swipe up.
  }

  hyprbars {
    bar_height = 25
    bar_color = rgb(212547)
    bar_text_size = 10
    bar_text_font = Jetbrains Mono Nerd Font Mono Bold
    bar_button_padding = 12
    bar_padding = 10
    bar_precedence_over_border = true
    hyprbars-button = rgb(ff5555), 18, , hyprctl dispatch killactive
    hyprbars-button = rgb(d7e855), 18, , hyprctl dispatch fullscreen 1
    hyprbars-button = rgb(3682dd), 18, , hyprctl dispatch togglefloating
    on_double_click = hyprctl dispatch fullscreen 1
  }
}

