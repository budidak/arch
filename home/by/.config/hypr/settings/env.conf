#
# ENVIRONMENT VARIABLES
# ~/.config/hypr/settings/env.conf
#

# TODO: Wayland lag/stuttering since kernel 6.11.2 (AMD)
# Until this issue is patched in future kernel releases, a workaround is to add `amdgpu.dcdebugmask=0x400` to the cmdline.

########################### HYPRLAND ###########################
# https://wiki.hyprland.org/Configuring/Environment-variables/ #
################################################################
env = HYPRLAND_TRACE,0  # Trace (very verbose) logging.
env = HYPRLAND_NO_RT,1  # Disables realtime priority setting by Hyprland.
env = HYPRLAND_NO_SD_NOTIFY,1  # If systemd, disables the `sd_notify` calls.
env = HYPRLAND_NO_SD_VARS,1  # Disables management of variables in systemd and dbus activation environments.
env = HYPRLAND_CONFIG,~/.config/hypr/  # Specifies where you want your Hyprland configuration.
env = HYPRCURSOR_THEME,Adwaita:dark  # Set cursor theme
env = HYPRCURSOR_SIZE,21  # Set cursor size

########################## AQUAMARINE ##########################
# https://github.com/hyprwm/aquamarine/blob/main/docs/env.md   #
# https://wiki.hyprland.org/Configuring/Environment-variables/ #
################################################################
# NOTE: Unless specified otherwise, a variable is enabled if and only if it's set to 1
env = AQ_TRACE,0  # Trace (very verbose) logging.
env = AQ_MGPU_NO_EXPLICIT,0  # Explicit syncing on mgpu buffers
env = AQ_NO_MODIFIERS,0  # Modifiers for DRM buffers
# env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0  # Explicit list of DRM devices (GPUs) to use.
## NOTE: Run the following commands to detect GPUs on the device
## lspci | grep -E 'VGA|3D'
## ls -l /dev/dri/by-path

########################################## NVIDIA ###########################################
# https://download.nvidia.com/XFree86/Linux-32bit-ARM/375.26/README/openglenvvariables.html #
# https://wiki.archlinux.org/title/Wayland                                                  #
# https://wiki.archlinux.org/title/Hardware_video_acceleration                              #
# https://wiki.hyprland.org/Configuring/Environment-variables/                              #
#############################################################################################
env = GBM_BACKEND,nvidia-drm  # Force GBM as a backend
env = __GLX_VENDOR_LIBRARY_NAME,nvidia  # Force GBM as a backend
env = LIBVA_DRIVER_NAME,nvidia  # Hardware acceleration on NVIDIA GPUs
env = __GL_GSYNC_ALLOWED,1  # Controls if G-Sync capable monitors should use Variable Refresh Rate (VRR)
env = __GL_VRR_ALLOWED,1  # Controls if Adaptive Sync should be used. Recommended to set as “0” to avoid having problems on some games.
env = NVD_BACKEND,direct  # Compositor uses a direct connection to the NVIDIA driver.

########################################################### QT ###########################################################
# https://github.com/pyqt/python-qt5/wiki/Qt-Environment-Variable-Reference                                              #
# https://doc.qt.io/qt-5/qtquick-visualcanvas-scenegraph-renderer.html#rendering-via-the-qt-rendering-hardware-interface #
# https://wiki.hyprland.org/Configuring/Environment-variables/                                                           #
##########################################################################################################################
env = QT_AUTO_SCREEN_SCALE_FACTOR,1  # (From the Qt documentation) enables automatic scaling, based on the monitor’s pixel density
env = QT_QPA_PLATFORM,wayland;xcb  # Tell Qt applications to use the Wayland backend, and fall back to x11 if Wayland is unavailable
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1  # Disables window decorations on Qt applications
env = QT_QPA_PLATFORMTHEME,qt6ct  # Tells Qt based applications to pick your theme from qt6ct, use with Kvantum.
env = QT_SCALE_FACTOR_ROUNDING_POLICY,RoundPreferFloor  # This prevents the application window being fractional scaled.

################################### WLROOTS #####################################
# https://gitlab.freedesktop.org/wlroots/wlroots/-/blob/master/docs/env_vars.md #
#################################################################################
env = WLR_BACKENDS,wayland,x11,drm  # Available backends: libinput, drm, wayland, x11, headless
env = WLR_NO_HARDWARE_CURSORS,1  # Use software cursors instead of hardware cursors
env = WLR_RENDERER,vulkan  # Forces the creation of a specified renderer

########################### CLUTTER ############################
# https://wiki.hyprland.org/Configuring/Environment-variables/ #
################################################################
env = CLUTTER_BACKEND,wayland  # Clutter package already has wayland enabled, this variable will force Clutter applications to try and use the Wayland backend.

############################# SDL ##############################
# https://wiki.hyprland.org/Configuring/Environment-variables/ #
################################################################
env = SDL_VIDEODRIVER,wayland,x11  # Run SDL2 applications on Wayland. Remove or set to x11 if games that provide older versions of SDL cause compatibility issues.

############################# XDG ##############################
# https://wiki.hyprland.org/Configuring/Environment-variables/ #
################################################################
# XDG specific environment variables are often detected through portals and applications that may set those for you, however it is not a bad idea to set them explicitly. 
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

####################### TOOLKIT BACKEND ########################
# https://wiki.hyprland.org/Configuring/Environment-variables/ #
################################################################
env = GDK_BACKEND,wayland,x11,*  # GTK: Use wayland if available. If not: try x11, then any other GDK backend.
env = GDK_SCALE,1
# env = GTK_THEME,Adwaita:dark  # Set a GTK theme.
# env = XCURSOR_THEME,Adwaita:dark  # Set cursor theme.
# env = XCURSOR_SIZE,21  # Set cursor size.

### OTHERS ###
##############
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = MOZ_ENABLE_WAYLAND,1
env = _JAVA_AWT_WM_NONREPARENTING,1
